# .agents/skills/verify/SKILL.md documents the loopback engine recipe, where
# the throwaway `admin_token` is passed to curl. `curl-auth-header` flags any
# Authorization header, so that line is a permanent false positive: the token is
# a local test value for an engine on 127.0.0.1, never a real credential.
paths = [
  '''^\.agents/skills/verify/SKILL\.md$''',
]
