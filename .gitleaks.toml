[extend]
useDefault = true

[allowlist]
description = "historical commits adding RFC_SAMPLE_KEY test fixtures, plus the loopback-engine verification recipe"
commits = [
  "0488388b5453db0a3f42045dfdc3486b6ee581db",
  "28642fe19e3fcd9248c89a522b9e560a958af666",
  "3dbbc66419251ad72de915e36102327e27b2c487",
  "6d0b70c074d8f3fd7d64c80fac864e85724ac904",
  "6eeb6c501d1aafbd5dda642abb468fa0f91aea65",
  "733ba5ae1ae9709ad8e25f006bbebb3f7fe4bec9",
]
# .agents/skills/verify/SKILL.md documents the loopback engine recipe, where
# the throwaway `admin_token` is passed to curl. `curl-auth-header` flags any
# Authorization header, so that line is a permanent false positive: the token is
# a local test value for an engine on 127.0.0.1, never a real credential.
paths = [
  '''^\.agents/skills/verify/SKILL\.md$''',
]

# Deployment values must not reach documentation. Verification records are
# written from a real session, which is exactly where a real engine address is
# easiest to paste into a guide, an ADR or a skill. Only private-network IPv4 is
# mechanical here — a personal namespace *slug* looks like any other word, so
# that half stays a discipline (use `<namespace>` / `<pool>` placeholders).
[[rules]]
id = "documented-deployment-address"
description = "A real private-network address in documentation — use <engine-host>"
path = '''^(?:docs/|\.agents/|README|CONTEXT)'''
regex = '''\b(?:10\.\d{1,3}|192\.168|172\.(?:1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}\b'''
  # The vendored archify skill ships its own test fixtures; they are sample
  # data for its renderers, not documentation of a deployment.
  [rules.allowlist]
  paths = ['''^\.agents/skills/archify/''']
